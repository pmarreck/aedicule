<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
		<title>Aedicule web application</title>
		<style>
			* { box-sizing: border-box; margin: 0; padding: 0; }
			html, body, canvas { width: 100%; height: 100%; }
			body { background: #080b14; color: #f4f7ff; }
			canvas { display: block; touch-action: none; outline: none; user-select: none; }
			#aedicule-startup-status {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				padding: 2rem;
				font: 600 1rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
				text-align: center;
				white-space: pre-wrap;
				z-index: 2147483647;
			}
			#aedicule-startup-status[data-state="error"] { color: #ffb8c2; }
		</style>
	</head>
	<body>
		<main id="aedicule-startup-status" role="status" aria-live="polite">Loading Aedicule…</main>
		<script type="module" src="./bootstrap.js?v=startup-diagnostics-2"></script>
	</body>
</html>
