<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
		<title>Aedicule web application</title>
		<link rel="icon" href="./icon.png">
		<link rel="manifest" href="./manifest.webmanifest">
		<style>
			* { box-sizing: border-box; margin: 0; padding: 0; }
			html, body, canvas { width: 100%; height: 100%; }
			body { background: #080b14; color: #f4f7ff; }
			canvas { display: block; touch-action: none; outline: none; }
			/* An Aedicule delivery is an application, not a document. Without
			   this a long press on a touch platform selects the page around the
			   canvas and raises the system callout, and the selection cannot be
			   dismissed by tapping back into the application. The prefixed
			   properties are the ones iOS actually honours; the unprefixed
			   `user-select` alone left `html` and `body` selectable. */
			html, body, canvas {
				-webkit-user-select: none;
				user-select: none;
				-webkit-touch-callout: none;
				-webkit-tap-highlight-color: transparent;
			}
			/* Text entry is the one place selection is wanted, so editable
			   elements opt back in rather than inheriting the suppression. */
			input, textarea, [contenteditable] {
				-webkit-user-select: text;
				user-select: text;
			}
			#aedicule-startup-status {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				padding: 2rem;
				font: 600 1rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
				text-align: center;
				white-space: pre-wrap;
				z-index: 2147483647;
			}
			#aedicule-startup-status[data-state="error"] { color: #ffb8c2; }
		</style>
	</head>
	<body>
		<main id="aedicule-startup-status" role="status" aria-live="polite">Loading Aedicule…</main>
		<script>
			/* Opt-in on-screen diagnostic for platforms with no reachable
			   developer console. A touch device cannot be inspected without a
			   tethered desktop, so the frame counter and the most recent
			   uncaught error have to be readable on the device itself. Absent
			   `?diag` this installs nothing and adds no element. */
			(() => {
				if (!new URLSearchParams(location.search).has("diag")) return;
				const errors = [];
				addEventListener("error", event => errors.push(
					`${event.message} @ ${event.filename ?? "?"}:${event.lineno ?? 0}`));
				addEventListener("unhandledrejection", event => errors.push(
					`rejection: ${event.reason}\n${
						String(event.reason?.stack ?? "").split("\n").slice(0, 2).join("\n")}`));
				/* A touch platform may synthesize a second, mouse-shaped gesture
				   from one finger. Counting the raw DOM events beside the count
				   of control events that actually reached the guest is what
				   separates "the tap was delivered twice" from "the tap was
				   delivered once and the guest did the wrong thing". */
				const taps = { pd: 0, pu: 0, ts: 0, te: 0, md: 0, mu: 0, ck: 0 };
				const names = { pointerdown: "pd", pointerup: "pu", touchstart: "ts",
					touchend: "te", mousedown: "md", mouseup: "mu", click: "ck" };
				let lastPoint = "-";
				/* A control only activates if the press and the release both land
				   inside the same declared rectangle. On a touch platform a finger
				   drifts, so recording which AVP button contained the press, which
				   contained the release, and how far the finger travelled between
				   them is what distinguishes "the target is too small for a finger"
				   from "delivery dropped the gesture". */
				const point = event => event.changedTouches?.[0] ?? event;
				const buttonAt = (x, y) => (globalThis.__AEDICULE_UI_SNAPSHOT?.buttons ?? [])
					.find(button => x >= button.x && x <= button.x + button.width
						&& y >= button.y && y <= button.y + button.height)?.id ?? "none";
				let pressed = { id: "-", x: 0, y: 0 };
				let released = "-";
				let drift = "-";
				for (const [type, key] of Object.entries(names)) {
					addEventListener(type, event => {
						taps[key] += 1;
						const contact = point(event);
						if (contact?.clientX === undefined) return;
						const x = contact.clientX;
						const y = contact.clientY;
						lastPoint = `${Math.round(x)},${Math.round(y)}`;
						if (type === "pointerdown") {
							pressed = { id: buttonAt(x, y), x, y };
							released = "-";
							drift = "-";
						} else if (type === "pointerup") {
							released = buttonAt(x, y);
							drift = Math.round(Math.hypot(x - pressed.x, y - pressed.y));
						}
					}, { capture: true, passive: true });
				}
				const panel = document.createElement("pre");
				panel.id = "aedicule-diagnostic-overlay";
				panel.style.cssText = "position:fixed;top:0;left:0;z-index:2147483646;"
					+ "margin:0;padding:.4rem .6rem;pointer-events:none;"
					+ "font:600 .8rem/1.35 ui-monospace,Menlo,monospace;"
					+ "color:#c8f7d0;background:rgba(0,0,0,.72);white-space:pre-wrap";
				let previousFrames = -1;
				let stalledPolls = 0;
				setInterval(() => {
					const runtime = globalThis.__AEDICULE_RUNTIME_DIAGNOSTIC;
					const frames = runtime?.framesCompleted ?? -1;
					if (frames === previousFrames) {
						stalledPolls += 1;
					} else {
						stalledPolls = 0;
						previousFrames = frames;
					}
					const delivered = globalThis.__AEDICULE_DELIVERED_EVENT_COUNTS;
					panel.textContent = [
						`frames ${frames}  stalled ${stalledPolls}`,
						`guest ${Math.round(runtime?.lastGuestElapsedMs ?? -1)}ms`,
						`ctl ${delivered?.controls ?? -1}  ptr ${delivered?.pointer ?? -1}`
							+ `  touch ${delivered?.touch ?? -1}`,
						(() => {
							const touch = globalThis.__AEDICULE_TOUCH_DIAGNOSTIC;
							return `touch-max ${globalThis.__AEDICULE_TOUCH_MAX_CONTACTS ?? -1}`
								+ ` raw ${touch?.rawActive ?? -1}`
								+ ` occ ${touch?.occludedActive ?? -1}`
								+ ` q ${globalThis.__AEDICULE_TOUCH_EVENTS?.length ?? -1}\n`
								+ `touch-enq ${touch?.enqueued ?? -1}`
								+ ` dis ${touch?.ignoredDisabled ?? -1}`
								+ ` occ-start ${touch?.occludedStarts ?? -1}`
								+ ` cap-fail ${touch?.captureFailures ?? -1}`
								+ ` last ${touch?.lastPhase ?? "-"}`;
						})(),
						(() => {
							const motion = globalThis.__AEDICULE_MOTION_DIAGNOSTIC;
							const error = motion?.errorName ? ` err ${motion.errorName}` : "";
							const magnitude = Number.isFinite(motion?.lastMagnitude)
								? motion.lastMagnitude.toFixed(1) : "-";
							return `motion ${motion?.permission ?? "absent"}`
								+ ` try ${motion?.permissionAttempts ?? 0}`
								+ ` no-int ${motion?.skippedNoInterest ?? 0}`
								+ ` no-act ${motion?.skippedNoActivation ?? 0}${error}\n`
								+ `motion cap ${motion?.samplesCaptured ?? 0}`
								+ ` q ${motion?.samplesQueued ?? 0}`
								+ ` src ${motion?.accelerationSource ?? "none"}`
								+ ` drain ${motion?.samplesDrained ?? 0}\n`
								+ `motion low ${motion?.belowThreshold ?? 0}`
								+ ` high ${motion?.aboveThreshold ?? 0}`
								+ ` emit ${motion?.gesturesEmitted ?? 0}`
								+ ` guest ${delivered?.motionGestures ?? 0}`
								+ ` mag ${magnitude}`;
						})(),
						`pd ${taps.pd} pu ${taps.pu} ts ${taps.ts} te ${taps.te} `
							+ `md ${taps.md} mu ${taps.mu} ck ${taps.ck}`,
						`down ${pressed.id}  up ${released}  drift ${drift}px`,
						`xy ${lastPoint}`,
						(() => {
							/* Web Audio on iOS fails silently from several
							   distinct causes (never unlocked, context
							   suspended, source errors). Rendering the context
							   state, the request count, and the last recorded
							   stage separates "the guest never asked" from
							   "the host could not play". */
							const audio = globalThis.__AEDICULE_AUDIO_DIAGNOSTIC;
							const last = audio?.last;
							const why = last?.reason ?? last?.errorName ?? "";
							return `au ${last?.contextState ?? "none"}`
								+ ` req ${audio?.requestCount ?? 0}`
								+ ` act ${last?.userActivationActive ?? "-"}\n`
								+ `au-last ${last?.stage ?? "-"}${why ? ` (${why})` : ""}`;
						})(),
						(() => {
							/* The guest lays out from the viewport it is told it
							   has. If that disagrees with the CSS viewport by the
							   device pixel ratio, every control it places is that
							   much too small to hit with a finger. */
							const canvas = document.querySelector("canvas");
							const box = canvas?.getBoundingClientRect();
							const play = (globalThis.__AEDICULE_UI_SNAPSHOT?.buttons ?? [])
								.find(button => button.id === 10);
							return `vp ${innerWidth}x${innerHeight} dpr ${devicePixelRatio}\n`
								+ `cv ${canvas?.width}x${canvas?.height}`
								+ ` css ${Math.round(box?.width ?? -1)}x${Math.round(box?.height ?? -1)}\n`
								+ `btn10 ${play ? `${Math.round(play.width)}x${Math.round(play.height)}`
									+ ` at ${Math.round(play.x)},${Math.round(play.y)}` : "none"}`;
						})(),
						`errors ${errors.length}`,
						errors.length > 0 ? errors[errors.length - 1] : "(none)",
					].join("\n");
				}, 500);
				addEventListener("DOMContentLoaded", () => document.body.append(panel));
			})();
		</script>
		<script type="module" src="./bootstrap.js?v=startup-diagnostics-2"></script>
	</body>
</html>
