[package]
name = "aedicule"
version = "0.1.4"
edition = "2024"
authors = ["Peter Marreck"]
description = "A generic GPUI frontplane for capability-bounded WAT applications"
license = "MIT"
repository = "https://github.com/pmarreck/aedicule"
homepage = "https://github.com/pmarreck/aedicule"
readme = "README.md"
keywords = ["gpui", "wasm", "wat", "wasmtime", "hot-reload"]
categories = ["gui", "game-development", "development-tools"]
publish = false
default-run = "aedicule"

[build-dependencies]
embed-resource = "3.0.11"

[features]
default = ["gui", "native-runtime"]
native-runtime = ["dep:wasmtime", "dep:wasmtime-wast"]
portable-runtime = ["dep:wasmi"]
web = [
	"portable-runtime",
	"dep:gpui",
	"dep:gpui-component",
	"dep:gpui-component-assets",
	"dep:gpui_platform",
	"dep:js-sys",
	"dep:wasm-bindgen",
	"dep:web-time",
]
gui = [
	"native-runtime",
	"dep:anyhow",
	"dep:gpui",
	"dep:gpui-component",
	"dep:gpui-component-assets",
	"dep:gpui_platform",
	"dep:rodio",
	"dep:smol",
]
gui-test-support = ["gui", "gpui/test-support"]

[dependencies]
async_zip = { version = "0.0.18", default-features = false }
claxon = "0.4.3"
futures-lite = "2.6.1"
thiserror = "2.0.16"
unicode-normalization = "0.1.25"
url = "2.5.8"
wat = "1.253.0"
wasmtime = { version = "46.0.1", default-features = false, features = ["cranelift", "runtime", "std", "gc-null"], optional = true }
wasmtime-wast = { version = "46.0.1", optional = true }
wasmi = { version = "1.1.0", default-features = false, features = ["std", "extra-checks"], optional = true }

anyhow = { version = "1.0.100", optional = true }
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit", "x11", "wayland", "runtime_shaders"], optional = true }
js-sys = { version = "0.3.103", optional = true }
wasm-bindgen = { version = "0.2.126", optional = true }
web-time = { version = "1.1.0", optional = true }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "b7e63cc29018c27bb24788ddb212f4cbdd861334", optional = true }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "b7e63cc29018c27bb24788ddb212f4cbdd861334", optional = true }
rodio = { version = "0.22.2", default-features = false, features = ["playback"], optional = true }
smol = { version = "2.0.2", optional = true }

# zed-xim otherwise enables ahash's compile-time RNG on Linux, embedding fresh
# random constants into every build. Runtime seeding preserves hash-flooding
# resistance while keeping release binaries reproducible.
[target.'cfg(target_os = "linux")'.dependencies]
ahash = { version = "0.8.12", features = ["runtime-rng"] }

[dev-dependencies]
wasmprinter = "0.251.0"

[[bin]]
name = "aedicule"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "aedicule-render"
path = "src/bin/aedicule-render.rs"

[[bin]]
name = "aedicule-web"
path = "src/bin/aedicule-web.rs"
required-features = ["web"]

[profile.release]
opt-level = 3
lto = "thin"

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/pmarreck/zed", rev = "cbea9c7fc97405da5681e5dd9457aeee469ec7c7" }
gpui_platform = { git = "https://github.com/pmarreck/zed", rev = "cbea9c7fc97405da5681e5dd9457aeee469ec7c7" }

[patch."https://github.com/pmarreck/zed"]
ztracing = { path = "third_party/ztracing" }
ztracing_macro = { path = "third_party/ztracing_macro" }
