name: CI

on:
  push:
    branches: [yolo]
  pull_request:
    branches: [yolo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test complete suite
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Reclaim unrelated hosted-runner toolchains
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false
          swap-storage: false
          tool-cache: false

      - name: Require cache restoration headroom
        run: |
          minimum_free_kib=25000000
          available_kib=$(df -Pk / | awk 'NR == 2 { print $4 }')
          if [[ ! $available_kib =~ ^[0-9]+$ ]] || (( available_kib < minimum_free_kib )); then
            printf 'GitHub test runner has %s KiB free; need at least %s KiB before cache restoration.\n' \
              "$available_kib" "$minimum_free_kib" >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore reusable Nix build products
        uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98
        with:
          diagnostic-endpoint: ""
          use-flakehub: false

      - name: Restore reusable Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cmd-format: nix develop -c {0}
          cache-bin: "false"
          cache-on-failure: "true"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/yolo' }}

      - name: Run complete test suite
        run: ./test

  targets:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [web, macos-aarch64, linux-aarch64, windows-aarch64, linux-x86_64, windows-x86_64]

    steps:
      - name: Reclaim unrelated hosted-runner toolchains
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false
          swap-storage: false
          tool-cache: false

      - name: Require cross-build headroom
        run: |
          minimum_free_kib=25000000
          available_kib=$(df -Pk / | awk 'NR == 2 { print $4 }')
          if [[ ! $available_kib =~ ^[0-9]+$ ]] || (( available_kib < minimum_free_kib )); then
            printf 'GitHub target runner has %s KiB free; need at least %s KiB before cross-building.\n' \
              "$available_kib" "$minimum_free_kib" >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build deterministic target archive
        run: nix build ".#release-${{ matrix.target }}" --out-link "result-${{ matrix.target }}" --print-build-logs

      - name: Stage exact GitHub Pages delivery
        if: matrix.target == 'web'
        run: |
          nix build .#delivery-web --out-link result-web --print-build-logs
          mkdir pages-site
          cp -RL result-web/. pages-site/
          install -Dm644 /dev/null pages-site/.nojekyll

      - name: Prove headerless Pages browser startup
        if: matrix.target == 'web'
        run: |
          chrome=$(command -v google-chrome)
          ./tests/integration/web_browser_startup \
            --chrome "$chrome" \
            --timeout-ms 60000 \
            --require-controls \
            --static-root pages-site/ulam-flower

      - name: Configure GitHub Pages
        if: matrix.target == 'web' && github.event_name == 'push' && github.ref == 'refs/heads/yolo'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: matrix.target == 'web' && github.event_name == 'push' && github.ref == 'refs/heads/yolo'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

  pages:
    name: Deploy browser demos
    if: github.event_name == 'push' && github.ref == 'refs/heads/yolo'
    needs: [test, targets]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
