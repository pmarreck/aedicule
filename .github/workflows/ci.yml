name: CI

on:
  push:
    branches: [yolo]
  pull_request:
    branches: [yolo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test complete suite
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run complete test suite
        run: ./test

  targets:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [web, macos-aarch64, linux-aarch64, windows-aarch64, linux-x86_64, windows-x86_64]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build deterministic target archive
        run: nix build ".#release-${{ matrix.target }}" --out-link "result-${{ matrix.target }}" --print-build-logs

      - name: Stage exact GitHub Pages delivery
        if: matrix.target == 'web'
        run: |
          nix build .#delivery-web --out-link result-web --print-build-logs
          mkdir pages-site
          cp -RL result-web/. pages-site/
          install -Dm644 /dev/null pages-site/.nojekyll

      - name: Prove headerless Pages browser startup
        if: matrix.target == 'web'
        run: ./tests/integration/web_browser_startup --static-root pages-site/ulam-flower

      - name: Configure GitHub Pages
        if: matrix.target == 'web' && github.event_name == 'push' && github.ref == 'refs/heads/yolo'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: matrix.target == 'web' && github.event_name == 'push' && github.ref == 'refs/heads/yolo'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

  pages:
    name: Deploy browser demos
    if: github.event_name == 'push' && github.ref == 'refs/heads/yolo'
    needs: [test, targets]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
